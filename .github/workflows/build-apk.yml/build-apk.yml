
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -name '*.zip' | head -n 1)"
          test -n "$ZIP_FILE"
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted

      - name: Build APK
        working-directory: extracted/mosoaat_iraq_android_project
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Mosoaat-Iraq-APK
          path: extracted/mosoaat_iraq_android_project/app/build/outputs/apk/debug/app-debug.apk
